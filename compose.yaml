name: greener

services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-greener}
      POSTGRES_USER: ${POSTGRES_USER:-greener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greener_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: