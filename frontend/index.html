<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#176b4d">
    <title>GreenER | Ambiente de desenvolvimento</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #18352b;
        background: #f2f7f3;
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(34rem, calc(100% - 3rem)); padding: 2rem; background: white; border-radius: 1rem; box-shadow: 0 1rem 3rem #18352b14; }
      h1 { margin-top: 0; color: #176b4d; }
      .status { padding: 1rem; border-radius: .5rem; background: #f2f7f3; }
      .status[data-state="ok"] { color: #176b4d; }
      .status[data-state="error"] { color: #a12e2e; }
    </style>
  </head>
  <body>
    <main>
      <h1>GreenER</h1>
      <p>Ambiente de desenvolvimento iniciado.</p>
      <p class="status" id="api-status" role="status" aria-live="polite">Verificando backend e banco de dados...</p>
    </main>
    <script>
      const status = document.querySelector("#api-status");
      fetch("/api/health/ready")
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((result) => {
          status.textContent = `Backend: ${result.status} · Banco de dados: ${result.database}`;
          status.dataset.state = "ok";
        })
        .catch((error) => {
          status.textContent = `Não foi possível verificar o backend: ${error.message}`;
          status.dataset.state = "error";
        });
    </script>
  </body>
</html>
